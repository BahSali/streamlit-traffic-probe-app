
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
      /* st.iframe always allows scrolling; the page never needs it. */
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .titles {
      display: grid;
      grid-template-columns: __GRID_COLUMNS__;
      gap: 8px;
      font-weight: 700;
      color: #1f2937;
    }

    .titles div {
      text-align: center;
      padding: 8px 6px;
      background: #f3f4f6;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      line-height: 1.25;
      font-size: 13px;
    }

    .maps {
      flex: 1;
      display: grid;
      grid-template-columns: __GRID_COLUMNS__;
      gap: 8px;
      min-height: 0;
    }

    .map {
      width: 100%;
      height: __MAP_HEIGHT__px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      overflow: hidden;
    }

    .leaflet-tooltip {
      padding: 0;
      margin: 0;
      border-radius: 6px;
    }

    .leaflet-tooltip-content {
      font-size: 12px;
      line-height: 1.35;
      margin: 6px 8px;
      min-width: 180px;
      max-width: 240px;
      white-space: normal;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .metric-highlight {
      display: inline-block;
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
      margin-left: 3px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
__PANEL_ROWS__
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.sync@0.2.4/L.Map.Sync.min.js"></script>

  <script>
    const data = __GEOJSON__;

    const center = [__CENTER_LAT__, __CENTER_LON__];
    const zoom = 12;

    // One entry per map, in page order: { id, colorKey, tooltip }.
    const panels = __PANELS__;
    // Display name of the foundation model (HTML-escaped); null: no foundation model.
    const foundationModelName = __FOUNDATION_MODEL_NAME__;

    const maps = panels.map(function(panel) {
      const map = L.map(panel.id, { zoomControl: true }).setView(center, zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      return map;
    });

    // Every map follows every other map (zoom and pan).
    maps.forEach(function(map) {
      maps.forEach(function(other) {
        if (other !== map) {
          map.sync(other);
        }
      });
    });

    function styleFactory(colorKey) {
      return function(feature) {
        return {
          color: feature.properties[colorKey] || '#222222',
          weight: 3,
          opacity: 0.95
        };
      };
    }

    // "<br><b>{name} estimate:</b> ..." line, highlighted on the foundation-model map;
    // empty when no foundation model is shown.
    function foundationLine(p, highlighted) {
      if (foundationModelName === null) {
        return '';
      }
      const value = p.foundation_model_speed_str ?? 'N/A';
      if (!highlighted) {
        return `<br>
          <b>${foundationModelName} estimate:</b> ${value}`;
      }
      return `<br>
          <b>${foundationModelName} estimate:</b>
          <span class="metric-highlight" style="background:${p.foundation_model_highlight_color ?? '#222222'};">
            ${value}
          </span>`;
    }

    function busTooltip(feature, layer) {
      const p = feature.properties || {};

      const html = `
        <div>
          <b>Segment:</b> ${p.segment_name ?? 'N/A'}<br>
          <b>Bus lines:</b> ${p.bus_lines_display ?? ''}<br>
          <b>Bus speed:</b>
          <span class="metric-highlight" style="background:${p.bus_highlight_color ?? '#222222'};">
            ${p.bus_speed_str ?? 'N/A'}
          </span><br>
          <b>Estimated speed:</b> ${p.est_speed_str ?? 'N/A'}${foundationLine(p, false)}
        </div>
      `;
      layer.bindTooltip(html, {
        sticky: true,
        direction: 'top',
        offset: [0, -8],
        opacity: 0.95
      });
    }

    function estimatedTooltip(feature, layer) {
      const p = feature.properties || {};

      const html = `
        <div>
          <b>Segment:</b> ${p.segment_name ?? 'N/A'}<br>
          <b>Bus lines:</b> ${p.bus_lines_display ?? ''}<br>
          <b>Bus speed:</b> ${p.bus_speed_str ?? 'N/A'}<br>
          <b>Estimated speed:</b>
          <span class="metric-highlight" style="background:${p.est_highlight_color ?? '#222222'};">
            ${p.est_speed_str ?? 'N/A'}
          </span>${foundationLine(p, false)}
        </div>
      `;
      layer.bindTooltip(html, {
        sticky: true,
        direction: 'top',
        offset: [0, -8],
        opacity: 0.95
      });
    }

    function googleTooltip(feature, layer) {
      const p = feature.properties || {};

      const html = `
        <div>
          <b>Segment:</b> ${p.segment_name ?? 'N/A'}<br>
          <b>Bus lines:</b> ${p.bus_lines_display ?? ''}<br>
          <b>Bus speed:</b> ${p.bus_speed_str ?? 'N/A'}<br>
          <b>Estimated speed:</b> ${p.est_speed_str ?? 'N/A'}${foundationLine(p, false)}<br>
          <b>Google-reported speed:</b>
          <span class="metric-highlight" style="background:${p.google_highlight_color ?? '#000000'};">
            ${p.google_speed_str ?? 'N/A'}
          </span><br>
          <b>Google duration:</b> ${p.google_duration_str ?? 'N/A'}
        </div>
      `;
      layer.bindTooltip(html, {
        sticky: true,
        direction: 'top',
        offset: [0, -8],
        opacity: 0.95
      });
    }

    function foundationTooltip(feature, layer) {
      const p = feature.properties || {};

      const html = `
        <div>
          <b>Segment:</b> ${p.segment_name ?? 'N/A'}<br>
          <b>Bus lines:</b> ${p.bus_lines_display ?? ''}<br>
          <b>Bus speed:</b> ${p.bus_speed_str ?? 'N/A'}<br>
          <b>Estimated speed:</b> ${p.est_speed_str ?? 'N/A'}${foundationLine(p, true)}
        </div>
      `;
      layer.bindTooltip(html, {
        sticky: true,
        direction: 'top',
        offset: [0, -8],
        opacity: 0.95
      });
    }

    const tooltips = {
      bus: busTooltip,
      estimated: estimatedTooltip,
      foundation: foundationTooltip,
      google: googleTooltip
    };

    const layers = panels.map(function(panel, i) {
      return L.geoJSON(data, {
        style: styleFactory(panel.colorKey),
        onEachFeature: tooltips[panel.tooltip]
      }).addTo(maps[i]);
    });

    try {
      const bounds = layers[0].getBounds();
      maps[0].fitBounds(bounds);
    } catch (error) {
      console.log(error);
    }
  </script>
</body>
</html>
